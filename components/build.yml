name: WriteReleaseMarker
description: Write a durable release marker into the AMI
schemaVersion: 1.0
parameters:
  - ReleaseId:
      type: string
      default: v1
phases:
  - name: build
    steps:
      - name: WriteReleaseMarker
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              install -o root -g root -m 0644 /dev/null /etc/asg-refresh-lab-release
              printf 'release=%s\nbuilt_at=%s\n' '{{ ReleaseId }}' "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" > /etc/asg-refresh-lab-release
              systemctl enable amazon-ssm-agent
